[project]
name = "capx"
version = "0.1.0"
description = "CaP-X: Code-as-Policies eXtended with RL for V(L)A code-as-action with simulators (LIBERO/robosuite/BEHAVIOR)."
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [
  { name = "CaP-X Authors" }
]
keywords = ["reinforcement-learning", "LLM", "VLM", "robotics", "VeRL", "GRPO", "PPO"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

#"decord"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "tyro>=0.8.5",
  "pydantic>=2.7",
  "rich>=13.7",
  "scipy>=1.12",
  "matplotlib>=3.10",
  "imageio[ffmpeg]",
  "requests",
  "tqdm",
  "h5py",
  "einops",
  "pycocotools",
  "pyyaml",
  "omegaconf",
  "open3d",
  "pyroki @ git+https://github.com/chungmin99/pyroki.git",
  "robot_descriptions>=1.16.0",
  "yourdfpy>=0.0.56",
  "viser>=0.2.0",
  "trimesh>=4.4.0",
  "imageio[ffmpeg]>=0.6.0",
  "sam3",
  "msgpack_numpy",
  "ray==2.48.0",
  "mediapy>=1.2.5",
  "uvicorn",
  "fastapi",
  "transformers",
  "openai",
  "pyrender",
  "opencv-python-headless",
  "pillow>=10",
  "cloudpickle",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff",
  "mypy>=1.10",
  "pillow>=10",
  "requests>=2.32",
]

libero = [
  "libero",
  "robosuite",
  "easydict==1.9",
  "robomimic==0.2.0",
  "einops==0.4.1",
  "thop==0.1.1-2209072238",
  "bddl==1.0.1",
  "future==0.18.2",
  "cloudpickle==2.1.0",
  "gym==0.25.2",
  "scikit-learn",
]
robosuite = [
  "robosuite"
]
molmo = [
  "tensorflow", 
  "accelerate"
]
curobo = [
  # Removed: nvidia-curobo, warp-lang (CUDA-only packages)
  "numpy-quaternion",
  "scikit-image",
]
contactgraspnet = [
  # Removed: contact_graspnet_pytorch (may require CUDA)
  "pyrender",
  "opencv-python-headless",
]
ovdet = [
  "transformers>=4.41",
  "pillow>=10",
  "requests>=2.32",
]
verl = [
  # Removed: torch, vllm, flash-attn (CUDA-only packages)
  "verl",
  "datasets>=4.1.1",
  "pyarrow>=15",
  "pyarrow>=21.0.0",
  "uvloop==0.21.0",
]

[tool.uv.sources]
robosuite = [
  { path = "capx/third_party/robosuite", extra = "robosuite", editable = true},
  { path = "capx/third_party/libero_dependencies/robosuite", extra = "libero", editable = true },
]
libero = [
  { path = "capx/third_party/LIBERO-PRO", extra = "libero", editable = true},
]
verl = { path = "capx/third_party/verl" }
# Removed: contact_graspnet_pytorch, nvidia-curobo (CUDA-only packages)
sam3 = { path = "capx/third_party/sam3", editable = true}

[tool.uv]
# Removed Linux-only restriction to support macOS
# environments = [
#     "sys_platform == 'linux' and platform_machine == 'x86_64'"
# ]
override-dependencies = [
    "transformers<5.0",
    # Removed: PyOpenGL-accelerate (Linux-only)
    "PyOpenGL==3.1.6",
    "numpy==1.26.4",
    "opencv-python-headless<4.13",
    "opencv-python ; sys_platform == 'never'",
    # Removed: jax, jaxlib (may have platform issues on macOS)
]
conflicts = [
  [
    { extra = "robosuite" },
    { extra = "libero" },
  ],
    [
    { extra = "molmo" },
    { extra = "robosuite" },
  ],
  [
    { extra = "molmo" },
    { extra = "verl" },
  ],
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capx*"]
exclude = ["tests*", "configs*"]

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake<3.27"]
# Removed: pointnet2, knn, flash-attn, contact-graspnet-pytorch, nvidia-curobo (CUDA-only)

[tool.uv.workspace]
exclude = [
    "capx/third_party/b1k",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["N803", "UP047", "N806", "F401", "E501"]
force-exclude = true
extend-exclude = [
  "capx/third_party/**",
  "third_party/**",
  "tests/**",
  "scripts/**",
  "outputs/**",
]

[tool.ruff.lint.per-file-ignores]
"capx/third_party/**" = ["ALL"]


[tool.setuptools.package-data]
"capx.envs" = [
  "assets/ur5_pick_place/*.xml",
  "assets/ur5_pick_place/ur5e/*.obj",
  "assets/ur5_pick_place/robotiq_2f85/*.stl",
]
